<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#123c47" />
  <meta name="description" content="BA ĐỘNG — Coastal Escape. Một guidebook kỹ thuật số về biển Ba Động và nhịp sống miền Tây." />
  <meta property="og:title" content="BA ĐỘNG — Coastal Escape" />
  <meta property="og:description" content="Nơi biển chạm vào nhịp sống miền Tây." />
  <meta property="og:type" content="website" />
  <base href="/" />
  <script>
    (function preloadHomeHero() {
      const baseUrl = new URL(document.querySelector('base')?.getAttribute('href') || '/', window.location.origin);
      let requestedUrl = new URL(window.location.href);

      try {
        const storedPath = window.sessionStorage.getItem('ba-dong-spa-path');
        if (storedPath) requestedUrl = new URL(storedPath, window.location.origin);
      } catch (_) {
        // The current URL remains authoritative when session storage is unavailable.
      }

      const normalizePath = path => path.endsWith('/') ? path : `${path}/`;
      if (requestedUrl.origin !== window.location.origin || normalizePath(requestedUrl.pathname) !== normalizePath(baseUrl.pathname)) return;

      const preload = document.createElement('link');
      preload.rel = 'preload';
      preload.as = 'image';
      preload.fetchPriority = 'high';
      preload.setAttribute('imagesrcset', 'images/locations/ba-dong-beach-800.jpg 960w, images/locations/ba-dong-beach-1600.jpg 1920w');
      preload.setAttribute('imagesizes', '100vw');
      document.head.append(preload);
    })();
  </script>
  <link rel="preload" id="webassembly" />
  <script type="importmap"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link href="BaDong.CoastalEscape.styles.css" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <div class="loading-shell loading-shell--initial"><span><span class="loading-dot"></span>Đang mở nhật ký ven biển…</span></div>
  </div>
  <div id="blazor-error-ui" style="display:none">Ứng dụng gặp lỗi. <a href=".">Tải lại</a></div>
  <script src="app.js"></script>
  <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>
</html>
